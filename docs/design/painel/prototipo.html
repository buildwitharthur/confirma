  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const btn = e.submitter || $('[type="submit"]', f);
  if (btn?.disabled) return;
  FORMS[f.dataset.form]?.(f, btn);
});
document.addEventListener('input', e => {
  if (e.target.id === 'template-body') { $('#tpl-preview-body').innerHTML = renderPreview(e.target.value); F('template').values.body = e.target.value; }
  else if (e.target.closest('[data-filters]') && e.target.name === 'q') onFilter(e.target);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.closest('[data-filters]') && t.tagName === 'SELECT') onFilter(t);
  if (t.dataset.sim) { S.sim[t.dataset.sim] = t.type === 'checkbox' ? t.checked : t.value; if (['listError', 'usageError'].includes(t.dataset.sim)) refresh(); }
  if (t.id === 'dp-notes') { S.notes = t.checked; document.body.classList.toggle('show-notes', t.checked); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (dlg.open) return;
    if ($('#sidebar')?.classList.contains('open')) { closeDrawer(); return; }
    if (!$('#demo-panel').hidden) { toggleDemo(false); $('#demo-fab').focus(); }
  }

/* =====================================================================
   13. CONTROLES DA DEMONSTRAÇÃO (não fazem parte do produto)
   ===================================================================== */
function toggleDemo(open) {
  const p = $('#demo-panel'), f = $('#demo-fab'); const on = open ?? p.hidden;
  p.hidden = !on; f.setAttribute('aria-expanded', String(on)); if (on) { renderDemo(); $('#demo-title').focus(); }
}
$('#demo-fab').addEventListener('click', () => toggleDemo());

  const sel = (k, l, opts) => `<label class="lbl">${l}<select data-sim="${k}">${opts.map(([v, t]) => `<option value="${v}" ${s[k] === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
  const routes = ROUTES.map(r => `<a href="#${r.demo || r.path}" ${cur === (r.re ? '' : r.path) || (r.re && r.re.test(cur)) ? 'aria-current="page" style="background:var(--branco-08);color:var(--branco)"' : ''}><span class="mono">${r.t}</span><span>${esc(r.path)}</span></a>`).join('');
  $('#demo-panel').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 id="demo-title" tabindex="-1">Controles da demonstração</h2><button type="button" class="icon-btn" style="color:var(--branco)" aria-label="Fechar controles" onclick="toggleDemo(false);document.getElementById('demo-fab').focus()">${icon('x')}</button></div>
    <p>Exclusivos do protótipo. Não representam funcionalidades do painel.</p>
    <div><h3>Cenários</h3><div class="dp-grid">${Object.entries(SCENARIOS).map(([k, v]) => `<button type="button" class="dp" data-action="scenario" data-key="${k}">${esc(v.label)}${S.ui.scenario === k ? '<span aria-hidden="true">●</span><span class="sr-only"> (atual)</span>' : ''}</button>`).join('')}</div></div>
    <div><h3>Respostas simuladas</h3><div class="dp-grid">
      ${sel('providerResult', 'Teste de conexão do WhatsApp', [['ok', 'Sucesso'], ['network_error', 'network_error'], ['authentication_failed', 'authentication_failed'], ['instance_not_found', 'instance_not_found'], ['instance_not_connected', 'instance_not_connected']])}
      ${sel('providerVersion', 'Versão retornada pela Evolution API', [[TARGET_VERSION, `${TARGET_VERSION} (versão-alvo, homologação pendente)`], ['2.4.0', '2.4.0 (diferente da versão-alvo)']])}

      ${chk('receiverFails', 'Receptor de webhook falha (testes e reenvios)')}
      ${chk('webhookRedirect', 'URL de webhook redireciona para destino proibido')}
      ${chk('recoveryDown', 'Registro externo de recuperação indisponível')}
      ${chk('expireNext', 'Expirar a sessão na próxima ação')}
      ${chk('listError', 'Erro na consulta de agendamentos')}
      ${chk('usageError', 'Uso mensal indisponível')}
      ${chk('mailDown', 'Envio de e-mail de recuperação indisponível')}
      ${chk('resetWriteFail', 'Falha ao gravar nova senha')}
      ${chk('termsError', 'Versões dos termos mudam no aceite')}
    </div></div>
    <div><h3>Eventos externos</h3><div class="dp-grid">
      <button type="button" class="dp" data-action="demo-disconnect">${S.provider?.status === 'disconnected' ? 'Instância volta a se conectar' : 'Instância do WhatsApp desconecta'}</button>

      <a href="#/redefinir-senha#demo-usado"><span class="mono">T-04</span><span>link de redefinição usado</span></a>
      <a href="#/agendamentos/agenda-7310"><span class="mono">T-09</span><span>registro retido / inexistente</span></a>

/* =====================================================================
   14. INICIALIZAÇÃO
   ===================================================================== */
S = SCENARIOS['sem-sessao'].build(); S.ui.scenario = 'sem-sessao';
if (!location.hash) history.replaceState(null, '', '#/entrar');
render(true);
