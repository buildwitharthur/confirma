# Substitui o default.conf da imagem oficial do Nginx (ver Dockerfile).
server {
    listen 80;

    # Saída do `astro build`, copiada pelo Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Comprime respostas de texto. HTML já é incluído por padrão;
    # imagens e fontes já vêm comprimidas e ficam de fora.
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript application/xml image/svg+xml;

    # Rotas inexistentes respondem 404 com a página do Astro (src/pages/404.astro).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Impede abrir /404.html diretamente; ela só é usada pelo error_page.
    location = /404.html {
        internal;
    }

    # Arquivos gerados pelo Astro têm hash no nome: um deploy novo gera nomes
    # novos, então podem ficar em cache por um ano. O HTML não entra aqui.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
