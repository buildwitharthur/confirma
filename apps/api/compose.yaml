services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: confirma
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: confirma-test
    ports:
      - '5433:5432'
    volumes:
      - postgres_data_test:/var/lib/postgresql

volumes:
  postgres_data:
  postgres_data_test:
